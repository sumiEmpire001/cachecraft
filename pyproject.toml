[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lord-sumi-cachecraft"
version = "0.1.0"
description = "Thread-safe cache policy library and reproducible comparison CLI"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cachecraft = "cachecraft.__main__:main"

[tool.setuptools.packages.find]
include = ["cachecraft*"]
